<!-- Homepage Screenshot Upload -->
<div>
    <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white text-center">Screenshot da página inicial</label>
    
    {% if project and project.homepage_screenshot %}
    <div class="mb-4 flex justify-center">
        <div class="w-full max-w-2xl">
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-2 text-center">Screenshot atual:</p>
            <div class="aspect-video w-full bg-gray-100 dark:bg-gray-700 rounded-lg overflow-hidden border border-gray-200 dark:border-gray-600">
                <img src="{{ project.homepage_screenshot.url }}" 
                     alt="Screenshot de {{ project.name }}" 
                     class="w-full h-full object-cover object-top">
            </div>
        </div>
    </div>
    {% endif %}
    
    <div class="flex justify-center">
        <label for="homepage_screenshot" class="flex flex-col items-center justify-center w-full max-w-2xl h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-gray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                <svg class="w-8 h-8 mb-2 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                </svg>
                <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Clique para enviar</span> ou arraste e solte</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">PNG, JPG ou WEBP (MAX. 5MB)</p>
            </div>
            <input id="homepage_screenshot" name="homepage_screenshot" type="file" class="hidden" accept="image/png,image/jpeg,image/webp" />
        </label>
    </div>
    
    <div class="mt-4 flex justify-center">
        <div class="w-full max-w-2xl p-3 bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg">
            <div class="flex items-start">
                <svg class="w-5 h-5 text-blue-600 dark:text-blue-400 mt-0.5 mr-2 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                </svg>
                <p class="text-xs text-blue-800 dark:text-blue-400">
                    <span class="font-medium">Opcional:</span> Um screenshot será criado automaticamente quando a primeira análise for executada. Você pode enviar um screenshot personalizado agora se preferir.
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    // Preview uploaded image and validate file size
    document.getElementById('homepage_screenshot').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const fileSize = file.size / 1024 / 1024; // in MB
            if (fileSize > 5) {
                alert('O arquivo é muito grande. O tamanho máximo é 5MB.');
                e.target.value = '';
            }
        }
    });
</script>
