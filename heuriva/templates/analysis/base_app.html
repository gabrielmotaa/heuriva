{% extends "base.html" %}

{% load static %}

{% block content %}
<div class="flex h-screen overflow-hidden bg-background-light dark:bg-background-dark">
    <!-- Main Content Container with navbar and scrollable area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 w-full bg-surface-light dark:bg-surface-dark border-b border-gray-200 dark:border-gray-800 h-20 flex items-center justify-between px-6 md:px-8">
        <div class="flex items-center">
            <a class="flex items-center" href="{% url 'analysis:project_list' %}">
                <img src="{% static 'assets/logo-dark.svg' %}" alt="Heuriva" class="w-[220px] logo-dark" />
                <img src="{% static 'assets/logo-light.svg' %}" alt="Heuriva" class="w-[220px] logo-light" />
            </a>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <!-- User Menu Button -->
                <div class="relative inline-block">
                    <button type="button" 
                        class="cursor-pointer flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" 
                        id="user-menu-button" 
                        aria-expanded="false" 
                        data-dropdown-toggle="user-dropdown" 
                        data-dropdown-placement="bottom"
                    >
                        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-primary to-blue-400 flex items-center justify-center text-white text-xs font-bold shadow-sm shrink-0">
                            {% if request.user.first_name and request.user.last_name %}
                                {{ request.user.first_name.0|upper }}{{ request.user.last_name.0|upper }}
                            {% else %}
                                {{ request.user.email.0|upper }}
                            {% endif %}
                        </div>
                        <span class="hidden md:block text-sm text-gray-700 dark:text-gray-300 font-medium">
                            {% if request.user.get_full_name %}{{ request.user.get_full_name }}{% else %}{{ request.user.email }}{% endif %}
                        </span>
                        <span class="material-icons-outlined text-gray-400" style="font-size:16px">expand_more</span>
                    </button>
                
                <!-- Dropdown menu -->
                <div class="z-50 hidden my-4 text-base list-none bg-surface-light divide-y divide-gray-100 rounded-lg shadow-lg border border-gray-100 dark:border-gray-700 dark:bg-surface-dark dark:divide-gray-600" id="user-dropdown">
                    <div class="px-4 py-3">
                        {% if request.user.get_full_name %}
                            <span class="block text-sm text-gray-900 dark:text-white">{{ request.user.get_full_name }}</span>
                        {% endif %}
                        <span class="block text-sm text-gray-500 truncate dark:text-gray-400">{{ request.user.email }}</span>
                    </div>
                    <ul class="py-2" aria-labelledby="user-menu-button">
                        <li>
                            <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 dark:text-gray-200 dark:hover:text-white">Minha conta</a>
                        </li>
                        <li>
                            <form action="{% url 'accounts:logout' %}" method="post" class="w-full">
                                {% csrf_token %}
                                <button type="submit" class="cursor-pointer w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 dark:text-gray-200 dark:hover:text-white">Sair</button>
                            </form>
                        </li>
                    </ul>
                </div>
                </div><!-- /relative inline-block -->

                <div class="h-6 w-px bg-gray-200 dark:bg-gray-700 mx-1"></div>
                <!-- Theme Toggle Button -->
                <button id="theme-toggle" type="button" class="w-8 h-8 flex items-center justify-center rounded-full cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors focus:outline-none">
                    <span id="theme-toggle-dark-icon" class="material-icons-outlined leading-none" style="font-size:18px">dark_mode</span>
                    <span id="theme-toggle-light-icon" class="material-icons-outlined leading-none" style="font-size:18px">light_mode</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Messages/Alerts -->
    <div class="max-w-screen-xl mx-auto px-4 pt-4">
        {% include "partials/alerts.html" %}
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto w-full">
        <main class="py-8 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            {% block app_content %}
            {% endblock %}
        </main>
    </div>
</div>
{% endblock %}
