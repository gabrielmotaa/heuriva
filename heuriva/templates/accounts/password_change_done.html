{% extends "base.html" %}

{% load static %}

{% block title %}Senha alterada - Heuriva{% endblock %}

{% block content %}
<div class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="absolute top-6 right-6">
        <button id="theme-toggle" class="w-8 h-8 flex items-center justify-center rounded-full text-text-muted-light dark:text-text-muted-dark hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors focus:outline-none cursor-pointer">
            <span id="theme-toggle-dark-icon" class="material-icons-outlined leading-none" style="font-size:18px">dark_mode</span>
            <span id="theme-toggle-light-icon" class="material-icons-outlined leading-none" style="font-size:18px">light_mode</span>
        </button>
    </div>

    <main class="w-full max-w-md">
        <div class="flex flex-col items-center mb-10">
            <a href="{% url 'pages:index' %}" class="mb-3">
                <img src="{% static 'assets/logo-dark.svg' %}" alt="Heuriva" class="w-auto logo-dark" />
                <img src="{% static 'assets/logo-light.svg' %}" alt="Heuriva" class="w-auto logo-light" />
            </a>
        </div>

        <div class="bg-surface-light dark:bg-surface-dark shadow-sm rounded-2xl border border-gray-200 dark:border-gray-800 px-8 py-10 text-center">
            <div class="w-14 h-14 rounded-full bg-green-50 dark:bg-green-900/20 flex items-center justify-center mx-auto mb-5">
                <span class="material-icons-outlined text-green-600 dark:text-green-400" style="font-size:28px">check_circle</span>
            </div>
            <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">Senha alterada</h2>
            <p class="text-sm text-text-muted-light dark:text-text-muted-dark mb-8">
                A sua senha foi atualizada com sucesso.
            </p>
            <a href="{% url 'accounts:login' %}" class="cursor-pointer inline-flex items-center justify-center w-full py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200">
                Voltar para o login
            </a>
        </div>
    </main>
</div>
{% endblock content %}
