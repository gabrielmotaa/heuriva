[project]
name = "heuriva"
version = "0.1.0"
description = "Automated usability and UX auditing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.64",
    "celery>=5.5.3",
    "dj-database-url>=3.0.1",
    "django~=5.2.0",
    "django-anymail[sendgrid]>=13.1",
    "django-browser-reload>=1.21.0",
    "django-celery-beat>=2.8.1",
    "django-celery-results>=2.6.0",
    "django-storages>=1.14.6",
    "django-watchfiles>=1.4.0",
    "google-genai>=1.47.0",
    "gunicorn>=23.0.0",
    "ipython>=9.6.0",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.2.12",
    "pydantic>=2.12.3",
    "python-decouple>=3.8",
    "redis>=7.0.1",
    "playwright>=1.49.0",
    "whitenoise[brotli]>=6.11.0",
    "zstandard>=0.25.0",
    "protego>=0.6.0",
]

[dependency-groups]
dev = [
    "django-rich>=2.2.0",
]

[tool.ruff.lint]
extend-select = ["I"]
